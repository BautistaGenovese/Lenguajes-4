<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>TP1 - Lenguajes 4</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;family=JetBrains+Mono:wght@700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Main Canvas -->
    <main class="contenedor">
        <div class="tarjeta">
            <div>
                <h2 class="titulo">Lenguajes IV: <br />TP 1</h2>
                <h3 class="encabezado">Bautista Genovese - 46.790.865</h3>
                <p class="subtitulo">
                    Obtenga datos geoespaciales con precisión <br />
                    y visualize imagenes de manera dinámica.
                </p>
            </div>

            <!-- Estructura de los datos de coordenadas -->
            <div class="seccion">
                <!-- Encabezado -->
                <h3 class="encabezado">Datos geoespaciales</h3>

                <!-- Fila: Error -->
                <div class="item-error oculto" id="error-coordenadas">
                </div>

                <!-- Fila: Latitud -->
                <div class="item-dato">
                    <div class="titulo-item">
                        <span aria-hidden="true" class="material-symbols-outlined icono-grande">explore</span>
                        <span class="etiqueta">Latitud</span>
                    </div>
                    <div class="acciones-item">
                        <span class="valor" id="valor-latitud">--</span>
                        <span class="valor-grados" id="valor-latitud-grados">(--)</span>
                    </div>
                </div>

                <!-- Fila: Longitud -->
                <div class="item-dato">
                    <div class="titulo-item">
                        <span aria-hidden="true" class="material-symbols-outlined icono-grande">public</span>
                        <span class="etiqueta">Longitud</span>
                    </div>
                    <div class="acciones-item">
                        <span class="valor" id="valor-longitud">--</span>
                        <span class="valor-grados" id="valor-longitud-grados">(--)</span>
                    </div>
                </div>

                <!-- Fila: Presición -->
                <div class="item-dato">
                    <div class="titulo-item">
                        <span aria-hidden="true" class="material-symbols-outlined icono-grande">target</span>
                        <span class="etiqueta">Precisión</span>
                    </div>
                    <span class="valor" id="valor-presicion">-- m</span>
                </div>
            </div>

            <!-- contenedor con la imagen y boton de subir -->
            <div class="seccion">
                <!-- Encabezado -->
                <h3 class="encabezado">Carga y muestreo de imagenes</h3>

                <!-- Error -->
                <div class="item-error oculto" id="error-imagen">
                </div>

                <!-- Boton para cargar imagen -->
                <button class="boton-primario" type="button" id="btn-cargar">
                    <span class="material-symbols-outlined">image_arrow_up</span>
                    Cargar imagen
                </button>

                <!-- Oculto el input porque nome gusta su estilo -->
                <!-- Internamente igual se hace un clic en él -->
                <input type="file" id="selector-foto" accept="image/*" title="Cargar imagen" hidden>

                <!-- Imagen a mostrar -->
                <div class="contenedor-imagen">
                    <img id="vista-previa" src="" alt="Vista previa">
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
